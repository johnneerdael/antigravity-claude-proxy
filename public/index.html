<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Antigravity Gateway - Account Management</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            surface: '#111827',
            card: '#1f2937',
            border: '#374151',
          }
        }
      }
    }
  </script>
  <link rel="stylesheet" href="style.css" />
</head>
<body class="bg-surface text-gray-100 min-h-screen font-sans">

  <header class="border-b border-border px-6 py-4 flex items-center justify-between">
    <div class="flex items-center gap-3">
      <span class="text-xl font-bold tracking-tight">⚡ Antigravity Gateway</span>
      <span id="server-status-badge" class="text-xs px-2 py-0.5 rounded-full bg-gray-700 text-gray-400">checking...</span>
    </div>
  </header>

  <main class="max-w-7xl mx-auto px-6 py-8">
    <h2 class="text-lg font-semibold mb-6">Account Management</h2>
    <div class="grid grid-cols-1 gap-6">

      <div class="card">
        <h3 class="card-title">Accounts & Quotas</h3>
        <div id="health-content" class="text-sm text-gray-400 mt-4">Loading...</div>
        <button onclick="loadHealth()" class="btn-secondary text-sm mt-4">↺ Refresh</button>
      </div>

      <div class="card">
        <h3 class="card-title">Actions</h3>
        <div class="flex flex-col gap-3 mt-4">
          <div>
            <p class="text-sm text-gray-400 mb-2">Force all accounts to refresh their OAuth tokens. Use this if you're getting authentication errors.</p>
            <button onclick="refreshTokens()" id="refresh-btn" class="btn-danger text-sm">⟳ Refresh All Tokens</button>
          </div>
        </div>
        <div id="action-result" class="mt-3 text-sm"></div>
      </div>

    </div>
  </main>

  <script src="app.js"></script>
</body>
</html>
